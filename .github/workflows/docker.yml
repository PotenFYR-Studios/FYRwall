name: Docker

# Container publishing with two modes:
#  1. Same version, new commits (push to master): rebuilds the image and
#     refreshes the existing vX.Y.Z + rolling tags. No new release; the
#     release build line is handled by release.yml.
#  2. Version bump (v* tag): full release - builds and pushes the :vX.Y.Z
#     image tag on top of rolling tags. The GitHub Release itself (changelog,
#     tarballs, installers) is owned by release.yml.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and mode
        id: ver
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo 0.1.0)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            # GITHUB_REF is refs/tags/vX.Y.Z, so strip the full prefix.
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "mode=same-version" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # rolling tags refreshed on every build
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=,format=short
            # full tag only on version-bump releases
            type=raw,value=v${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.mode == 'release' }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.sha }}
